<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        fieldset {
            display: flex;
            justify-content: center;
        }

        .search-field{
            display: none;
        }

        div{
            background: gray;
        }
    </style>
</head>
<body>
    <h1>Practice6</h1>
    <form action="">
        <fieldset>
            <legend align="center">검색할 항목을 선택하세요.</legend>
            <input type="radio" name="search-option" id="title-radio" value="title-field"> 제목
            <input type="radio" name="search-option" id="date-radio" value="date-field"> 날짜
            <input type="radio" name="search-option" id="id-radio" value="id-field">작성자
        </fieldset>
        
        <br>

        <div class="search-fields">
            <div id="title-field" class="search-field">
                검색할 제목을 입력하세요 : <br>
                <input type="text">
                <input type="submit" name="" id="" value="검색">
            </div>
            <div id="date-field" class="search-field">
                검색할 날짜를 입력하세요 : <br>
                <input type="date">
                -
                <input type="text" placeholder="연도-월-일">
                <input type="submit" name="" id="" value="검색">
            </div>
            <div id="id-field" class="search-field">
                검색할 작성자 아이디를 입력하세요: <br>
                <input type="text">
                <input type="submit" name="" id="" value="검색">
            </div>
        </div>
    </form>

    <script>
        const radioButtons = document.querySelectorAll('input[name="search-option"]');
        const searchFields = document.querySelectorAll('.search-field');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', (event) => {
                searchFields.forEach(field => {
                    field.style.display = 'none';
                });

                const selectedValue = event.target.value;
                const targetField = document.getElementById(selectedValue);
                if (targetField) {
                    targetField.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
